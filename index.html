    <script>
      (function() {
        // Defensive protection against Web3 browser extensions (e.g. Phantom, MetaMask, evmAsk)
        // colliding when injecting window.ethereum with Object.defineProperty
        try {
          var _ethVal = undefined;
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && prop === 'ethereum') {
              try {
                if (descriptor && typeof descriptor === 'object') {
                  descriptor.configurable = true;
                }
                return origDefineProperty.call(Object, obj, prop, descriptor);
              } catch (e) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    window.ethereum = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            return origDefineProperty.apply(Object, arguments);
          };

          if (!('ethereum' in window)) {
            try {
              origDefineProperty.call(Object, window, 'ethereum', {
                get: function() { return _ethVal; },
                set: function(v) { _ethVal = v; },
                configurable: true,
                enumerable: true,
              });
            } catch (_) {}
          }
        } catch (_) {}

        // Suppress unhandled extension injection exceptions from crashing the app
        window.addEventListener('error', function(event) {
          if (
            (event.message && (
              event.message.includes('Cannot redefine property: ethereum') ||
              event.message.includes('ethereum')
            )) ||
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.error && event.error.stack && event.error.stack.includes('chrome-extension://'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.message &&
            (event.reason.message.includes('Cannot redefine property: ethereum') ||
             event.reason.message.includes('chrome-extension://'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
